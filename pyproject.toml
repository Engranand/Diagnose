[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diagnose"
version = "0.1.0"
description = "Production Incident Management & Root-Cause Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "structlog>=24.0",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "email-validator>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/diagnose"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
